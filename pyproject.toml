[project]
name = "sql-generation-assistant"
version = "0.1.0"
description = "Natural language to SQL assistant using Gemini and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlglot>=26.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27"
]

[tool.pytest.ini_options]
pythonpath = ["."]